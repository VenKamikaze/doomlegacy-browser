<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doom Legacy</title>
<link rel="stylesheet" href="page.css">
</head>
<body>
<main id="stage">
  <canvas id="canvas" width="320" height="200" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="overlay" role="status">
    <h1>Doom Legacy</h1>
    <progress id="progress" max="100" value="0" hidden></progress>
    <p id="status">Loading...</p>
    <button id="start" type="button" hidden>Click to start</button>
    <button id="reload" type="button" hidden>Reload the page</button>
  </div>
</main>
<p id="help" hidden>Arrows move, Ctrl fires, Space opens doors, Escape is the menu. Click the picture to capture the mouse.</p>
<p id="testinfo" hidden></p>
<script src="page.js"></script>
</body>
</html>
